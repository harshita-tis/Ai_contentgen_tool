<!-- ── Shared Sidebar Component CSS ── -->
<style>
  :root {
    --sidebar-expanded: 188px;
    --sidebar-collapsed: 55px;
  }

  .sidebar {
    width: var(--sidebar-expanded);
    min-height: 100vh;
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    left: 0;
    top: 0;
    z-index: 100;
    padding: 12px 0 14px;
    overflow: hidden;
    transition: width 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .sidebar.collapsed {
    width: var(--sidebar-collapsed);
  }

  .sidebar-logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 10px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
    flex-shrink: 0;
    white-space: nowrap;
    overflow: hidden;
  }

  .sidebar-logo-icon {
    width: 28px;
    height: 28px;
    min-width: 28px;
    background: var(--gradient-accent);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    flex-shrink: 0;
  }

  .sidebar-logo-icon svg {
    width: 14px;
    height: 14px;
  }

  .sidebar-logo-text {
    font-family: var(--font-head);
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    opacity: 1;
    transition: opacity 0.15s;
  }

  .sidebar.collapsed .sidebar-logo-text {
    opacity: 0;
    pointer-events: none;
  }

  .sidebar-nav {
    flex: 1;
    padding: 0 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 99px;
    color: var(--text-3);
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
    cursor: pointer;
    border: none;
    background: none;
    white-space: nowrap;
    overflow: hidden;
    width: 100%;
    position: relative;
  }

  .nav-item:hover {
    background: var(--surface2);
    color: var(--text);
  }

  .nav-item.active {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .nav-item svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .nav-label {
    font-size: 0.82rem;
    font-weight: 500;
    opacity: 1;
    transition: opacity 0.15s;
  }

  .sidebar.collapsed .nav-label {
    opacity: 0;
    pointer-events: none;
  }

  .nav-item .tooltip {
    position: absolute;
    left: calc(var(--sidebar-collapsed) + 8px);
    top: 50%;
    transform: translateY(-50%);
    background: var(--surface3);
    border: 1px solid var(--border2);
    color: var(--text);
    font-size: 0.72rem;
    font-weight: 600;
    white-space: nowrap;
    padding: 4px 9px;
    border-radius: 6px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 200;
    box-shadow: var(--shadow-md);
  }

  .sidebar.collapsed .nav-item:hover .tooltip {
    opacity: 1;
  }

  .sidebar-bottom {
    margin-top: auto;
    padding: 0 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow: hidden;
  }

  .sidebar-toggle-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 8px;
    border-radius: 9px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-3);
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
    transition: background 0.15s, color 0.15s;
  }

  .sidebar-toggle-btn:hover {
    background: var(--surface2);
    color: var(--text);
  }

  .sidebar-toggle-btn svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    transition: transform 0.22s;
  }

  .sidebar.collapsed .sidebar-toggle-btn svg {
    transform: rotate(180deg);
  }

  .sidebar-toggle-label {
    font-size: 0.78rem;
    font-weight: 500;
    opacity: 1;
    transition: opacity 0.15s;
  }

  .sidebar.collapsed .sidebar-toggle-label {
    opacity: 0;
    pointer-events: none;
  }

  .theme-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    white-space: nowrap;
    overflow: hidden;
  }

  .theme-row-label {
    font-size: 0.75rem;
    color: var(--text-3);
    font-weight: 500;
    opacity: 1;
    transition: opacity 0.15s;
  }

  .sidebar.collapsed .theme-row-label {
    opacity: 0;
    pointer-events: none;
  }

  .theme-toggle {
    width: 32px;
    height: 18px;
    min-width: 32px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .theme-toggle::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    background: var(--text-3);
    border-radius: 50%;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  [data-theme="light"] .theme-toggle::after {
    transform: translateX(14px);
    background: var(--accent);
  }

  .main {
    margin-left: var(--sidebar-expanded);
    transition: margin-left 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .main.collapsed {
    margin-left: var(--sidebar-collapsed);
  }
</style>

<!-- ── Shared Sidebar JS ── -->
<script>
  function toggleSidebar() {
    var sidebar = document.getElementById("sidebar");
    var main = document.querySelector(".main") || document.getElementById("mainContent") || document.getElementById("appBody");
    if (sidebar) sidebar.classList.toggle("collapsed");
    if (main) main.classList.toggle("collapsed");
    if (sidebar) {
      localStorage.setItem("sidebarCollapsed", sidebar.classList.contains("collapsed") ? "1" : "0");
    }
  }

  (function () {
    if (localStorage.getItem("sidebarCollapsed") === "1") {
      var sidebar = document.getElementById("sidebar");
      var main = document.querySelector(".main") || document.getElementById("mainContent") || document.getElementById("appBody");
      if (sidebar) sidebar.classList.add("collapsed");
      if (main) main.classList.add("collapsed");
    }
  })();
</script>
